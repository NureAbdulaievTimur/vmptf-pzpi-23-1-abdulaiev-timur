<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Дані про мене</title>
</head>
<body>
    <h1>Мій профіль</h1>
    <div id="profile-container"></div>

    <script>
        fetch('data.json')
            
            .then(response => response.text())
            .then(text => {

                const myData = JSON.parse(text);
                
                const container = document.getElementById('profile-container');

                const nameElement = document.createElement('p');
                nameElement.textContent = `Ім'я: ${myData.name}`;

                const ageElement = document.createElement('p');
                ageElement.textContent = `Вік: ${myData.age}`;

                const hobbiesElement = document.createElement('p');
                hobbiesElement.textContent = `Хобі: ${myData.hobbies.join(', ')}`;

                container.appendChild(nameElement);
                container.appendChild(ageElement);
                container.appendChild(hobbiesElement);
            })
            .catch(error => console.log("Помилка завантаження даних:", error));
    </script>
</body>
</html>
